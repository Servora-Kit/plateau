version: v2

clean: true

plugins:
    # generate go struct code
    - local: ["go", "tool", "protoc-gen-go"]
      out: api/gen/go
      opt: paths=source_relative

    # generate grpc service code
    - local: ["go", "tool", "protoc-gen-go-grpc"]
      out: api/gen/go
      opt: paths=source_relative

    # generate kratos http service code
    - local: ["go", "tool", "protoc-gen-go-http"]
      out: api/gen/go
      opt: paths=source_relative

    # generate kratos errors code
    - local: ["go", "tool", "protoc-gen-go-errors"]
      out: api/gen/go
      opt: paths=source_relative

    # generate message validator code
    - local: ["go", "tool", "protoc-gen-validate"]
      out: api/gen/go
      opt:
          - paths=source_relative
          - lang=go

    # generate redact code (field-level log redaction)
    - local: ["go", "tool", "protoc-gen-redact"]
      out: api/gen/go
      opt:
          - paths=source_relative
          - lang=go

    # ==================== Plateau & Servora custom plugins ====================
    # generate authn rules from Plateau proto annotations
    - local: ["go", "tool", "protoc-gen-plateau-authn"]
      out: api/gen/go
      opt: paths=source_relative

    # generate authz rules from Plateau proto annotations
    - local: ["go", "tool", "protoc-gen-plateau-authz"]
      out: api/gen/go
      opt: paths=source_relative

    # generate audit rules from Plateau proto annotations
    - local: ["go", "tool", "protoc-gen-plateau-audit"]
      out: api/gen/go
      opt: paths=source_relative

    # generate typed CRUD descriptors, field paths, and resource-name helpers
    - local: ["go", "tool", "protoc-gen-plateau-crud"]
      out: api/gen/go
      opt: paths=source_relative

    # 根据 Proto 注解生成唯一的 Apply 配置处理方法
    - local: ["go", "tool", "protoc-gen-servora-conf"]
      out: api/gen/go
      opt: paths=source_relative
