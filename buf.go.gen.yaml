version: v2

clean: true

plugins:
    # generate go struct code
    - local: protoc-gen-go
      out: api/gen/go
      opt: paths=source_relative

    # generate grpc service code
    - local: protoc-gen-go-grpc
      out: api/gen/go
      opt: paths=source_relative

    # generate kratos http service code
    - local: protoc-gen-go-http
      out: api/gen/go
      opt: paths=source_relative

    # generate kratos errors code
    - local: protoc-gen-go-errors
      out: api/gen/go
      opt: paths=source_relative

    # generate message validator code
    - local: protoc-gen-validate
      out: api/gen/go
      opt:
          - paths=source_relative
          - lang=go

    # generate redact code (field-level log redaction)
    - local: protoc-gen-go-redact
      out: api/gen/go
      opt:
          - paths=source_relative
          - lang=go

    # ==================== Servora custom plugins ====================
    # generate authn rules from Plateau proto annotations
    - local: protoc-gen-plateau-authn
      out: api/gen/go
      opt: paths=source_relative

    # generate authz rules from Plateau proto annotations
    - local: protoc-gen-plateau-authz
      out: api/gen/go
      opt: paths=source_relative


    # generate typed CRUD descriptors, field paths, and resource-name helpers
    - local: protoc-gen-servora-crud
      out: api/gen/go
      opt: paths=source_relative

    # generate audit rules from proto annotations
    - local: protoc-gen-servora-audit
      out: api/gen/go
      opt: paths=source_relative

    # generate conf SectionKey/ApplyDefaults/ValidateConf from proto annotations
    - local: protoc-gen-servora-conf
      out: api/gen/go
      opt: paths=source_relative
