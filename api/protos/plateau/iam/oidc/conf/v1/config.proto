syntax = "proto3";

package plateau.iam.oidc.conf.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "servora/conf/v1/annotations.proto";
import "servora/redact/v3/redact.proto";

option go_package = "github.com/Servora-Kit/plateau/api/gen/go/plateau/iam/oidc/conf/v1;iamoidcconfv1";

// OIDC configures the Plateau IAM OpenID Provider.
message OIDC {
  option (servora.conf.v1.section) = true;

  // The single public origin used as issuer, IAM Web origin and mail-link base.
  optional string issuer = 1 [
    (servora.conf.v1.field) = {required: true},
    (buf.validate.field).string.min_len = 1
  ];
  // Stable RS256 private-key path; this key is distinct from TLS and crypto keys.
  optional string signing_key_path = 2 [
    (servora.conf.v1.field) = {required: true},
    (buf.validate.field).string.min_len = 1
  ];
  // Stable zitadel/oidc provider crypto-key path, distinct from signing and TLS keys.
  optional string crypto_key_path = 3 [
    (servora.conf.v1.field) = {required: true},
    (buf.validate.field).string.min_len = 1
  ];
  // 静态应用注册；允许的用户或机器流程由各客户端的授权类型决定。
  repeated OAuthClient clients = 4;
  google.protobuf.Duration service_access_token_ttl = 5 [(servora.conf.v1.field) = {default: "5m"}];
  google.protobuf.Duration auth_request_ttl = 6 [(servora.conf.v1.field) = {default: "30m"}];
}

// OAuthClient 配置启动期协调的静态引导应用。
message OAuthClient {
  optional string client_id = 1 [
    (servora.conf.v1.field) = {required: true},
    (buf.validate.field).string.min_len = 1
  ];
  // Raw secret is configuration input only; required for confidential clients, omitted for public clients.
  optional string client_secret = 2 [(servora.redact.v3.value).string = ""];
  // Redirect URIs are compared exactly; wildcards are not supported.
  repeated string redirect_uris = 3;
  // 请求 scope 必须在允许集合中；用户流程还须符合提供方支持的用户 scope。
  repeated string allowed_scopes = 4;
  // 第一方受信应用跳过授权同意页；非受信应用进入第三方 Consent 流程。
  bool trusted = 5;
  repeated string allowed_grant_types = 6 [(buf.validate.field).repeated.min_items = 1];
  repeated string audiences = 7;
  optional string display_name = 8;
  optional string description = 9;
  optional string logo_uri = 10;
  repeated string post_logout_redirect_uris = 11;
  // Application runtime type: "web" (default), "user_agent", or "native".
  optional string application_type = 12;
  // Token endpoint auth method: "client_secret_basic" (default), "client_secret_post", or "none".
  optional string token_endpoint_auth_method = 13;
}
