syntax = "proto3";

package plateau.security.audit.v1;

import "servora/conf/v1/annotations.proto";

option go_package = "github.com/Servora-Kit/plateau/api/gen/go/plateau/security/audit/v1;auditpb";

// AuditEmitter configures outbound CloudEvents audit delivery for a service.
message AuditEmitter {
  option (servora.conf.v1.section) = true;

  bool enabled = 1;
  optional string backend = 2 [(servora.conf.v1.field) = {default: "noop"}];
  optional string topic = 3 [(servora.conf.v1.field) = {default: "plateau.audit.events"}];
}
