syntax = "proto3";

package plateau.admin.auth.v1;

import "google/api/annotations.proto";
import "plateau/iam/user/v1/user.proto";
import "plateau/security/audit/v1/annotations.proto";
import "plateau/security/authn/v1/annotations.proto";
import "plateau/security/authz/v1/annotations.proto";

option go_package = "github.com/Servora-Kit/plateau/api/gen/go/plateau/admin/auth/v1;adminauthv1";

// AuthService 提供 Admin BFF 会话查询与独立本地登出接口。
service AuthService {
  option (plateau.security.authn.v1.service_default) = {mode: AUTHN_MODE_REQUIRED};
  option (plateau.security.authz.v1.service_default) = {
    mode: AUTHZ_MODE_REQUIRED
    action: "access"
    resource_type: "admin"
    resource_id: "global"
  };
  option (plateau.security.audit.v1.service_default) = {mode: AUDIT_MODE_DISABLED};

  // GetSession 返回当前管理员的本地会话快照与实时权限码列表。
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {
    option (google.api.http) = {get: "/v1/admin/auth/session"};
  }

  // Logout 仅销毁 Admin 本地 SCS 会话，不撤销上游 IAM 会话。
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/v1/admin/auth/logout"
      body: "*"
    };
    option (plateau.security.authz.v1.rule) = {mode: AUTHZ_MODE_NONE};
    option (plateau.security.audit.v1.rule) = {
      mode: AUDIT_MODE_ENABLED
      category: AUDIT_CATEGORY_AUTHN
    };
  }
}

message GetSessionRequest {}

message GetSessionResponse {
  plateau.iam.user.v1.User user = 1;
  repeated string permissions = 2;
}

message LogoutRequest {}

message LogoutResponse {}
