syntax = "proto3";

package plateau.admin.client.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "plateau/iam/client/v1/client.proto";
import "plateau/security/audit/v1/annotations.proto";
import "plateau/security/authn/v1/annotations.proto";
import "plateau/security/authz/v1/annotations.proto";
import "servora/errors/v1/errors.proto";
import "servora/redact/v3/redact.proto";

option go_package = "github.com/Servora-Kit/plateau/api/gen/go/plateau/admin/client/v1;adminclientv1";

// OAuthClientService 面向平台管理员提供 IAM OAuth 2.0 / OIDC 客户端的编排管理接口。
service OAuthClientService {
  option (plateau.security.authn.v1.service_default) = {mode: AUTHN_MODE_REQUIRED};
  option (plateau.security.authz.v1.service_default) = {
    mode: AUTHZ_MODE_REQUIRED
    action: "manage_clients"
    resource_type: "admin"
    resource_id: "global"
  };
  option (plateau.security.audit.v1.service_default) = {
    mode: AUDIT_MODE_ENABLED
    category: AUDIT_CATEGORY_RESOURCE
  };

  // ListOAuthClients 分页查询静态与动态 OAuth 客户端。
  rpc ListOAuthClients(ListOAuthClientsRequest) returns (ListOAuthClientsResponse) {
    option (google.api.http) = {get: "/v1/admin/oauth-clients"};
    option (google.api.method_signature) = "page_size,page_token,filter,order_by";
    option (plateau.security.audit.v1.rule) = {mode: AUDIT_MODE_DISABLED};
  }

  // GetOAuthClient 按规范资源名查询单个 OAuth 客户端详情及脱敏密钥列表。
  rpc GetOAuthClient(GetOAuthClientRequest) returns (plateau.iam.client.v1.OAuthClient) {
    option (google.api.http) = {get: "/v1/admin/{name=oauthClients/*}"};
    option (google.api.method_signature) = "name";
    option (plateau.security.audit.v1.rule) = {mode: AUDIT_MODE_DISABLED};
  }

  // CreateOAuthClient 创建动态 OAuth 客户端并在机密类型下一次性返回初始密钥明文。
  rpc CreateOAuthClient(CreateOAuthClientRequest) returns (CreateOAuthClientResponse) {
    option (google.api.http) = {
      post: "/v1/admin/oauth-clients"
      body: "*"
    };
    option (google.api.method_signature) = "oauth_client,oauth_client_id";
  }

  // UpdateOAuthClient 更新动态 OAuth 客户端的可编辑字段。
  rpc UpdateOAuthClient(UpdateOAuthClientRequest) returns (plateau.iam.client.v1.OAuthClient) {
    option (google.api.http) = {
      patch: "/v1/admin/{oauth_client.name=oauthClients/*}"
      body: "oauth_client"
    };
    option (google.api.method_signature) = "oauth_client,update_mask";
  }

  // DisableOAuthClient 禁用动态 OAuth 客户端并撤销其活跃令牌与在途流程。
  rpc DisableOAuthClient(DisableOAuthClientRequest) returns (plateau.iam.client.v1.OAuthClient) {
    option (google.api.http) = {
      post: "/v1/admin/{name=oauthClients/*}:disable"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // EnableOAuthClient 重新启用已禁用的动态 OAuth 客户端。
  rpc EnableOAuthClient(EnableOAuthClientRequest) returns (plateau.iam.client.v1.OAuthClient) {
    option (google.api.http) = {
      post: "/v1/admin/{name=oauthClients/*}:enable"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // DeleteOAuthClient 永久删除动态 OAuth 客户端并级联清理其密钥、授权记录与活跃会话。
  rpc DeleteOAuthClient(DeleteOAuthClientRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/admin/{name=oauthClients/*}"};
    option (google.api.method_signature) = "name";
  }

  // CreateOAuthClientSecret 为机密动态客户端新增一把密钥并一次性返回明文。
  rpc CreateOAuthClientSecret(CreateOAuthClientSecretRequest) returns (CreateOAuthClientSecretResponse) {
    option (google.api.http) = {
      post: "/v1/admin/{name=oauthClients/*}/secrets"
      body: "*"
    };
    option (google.api.method_signature) = "name,secret_name";
  }

  // DeleteOAuthClientSecret 删除机密动态客户端的指定密钥（至少保留一把未过期密钥）。
  rpc DeleteOAuthClientSecret(DeleteOAuthClientSecretRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/admin/{name=oauthClients/*}/secrets/{secret_id}"};
    option (google.api.method_signature) = "name,secret_id";
  }
}

// AdminClientErrorReason 定义 Admin OAuth 客户端管理编排的公开业务错误原因。
enum AdminClientErrorReason {
  option (servora.errors.v1.default_code) = 500;

  ADMIN_CLIENT_ERROR_REASON_UNSPECIFIED = 0;
  ADMIN_CLIENT_ERROR_REASON_NOT_FOUND = 1 [(servora.errors.v1.code) = 404];
  ADMIN_CLIENT_ERROR_REASON_ALREADY_EXISTS = 2 [(servora.errors.v1.code) = 409];
  ADMIN_CLIENT_ERROR_REASON_STATIC_CLIENT_IMMUTABLE = 3 [(servora.errors.v1.code) = 403];
  ADMIN_CLIENT_ERROR_REASON_INVALID_CONFIG = 4 [(servora.errors.v1.code) = 400];
  ADMIN_CLIENT_ERROR_REASON_INVALID_STATE = 5 [(servora.errors.v1.code) = 409];
  ADMIN_CLIENT_ERROR_REASON_ETAG_MISMATCH = 6 [(servora.errors.v1.code) = 409];
  ADMIN_CLIENT_ERROR_REASON_SECRET_LIMIT_EXCEEDED = 7 [(servora.errors.v1.code) = 409];
  ADMIN_CLIENT_ERROR_REASON_LAST_ACTIVE_SECRET = 8 [(servora.errors.v1.code) = 409];
  ADMIN_CLIENT_ERROR_REASON_DOWNSTREAM_UNAVAILABLE = 9 [(servora.errors.v1.code) = 503];
}

message ListOAuthClientsRequest {
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];
  string order_by = 4 [(google.api.field_behavior) = OPTIONAL];
  bool include_total = 5 [(google.api.field_behavior) = OPTIONAL];
}

message ListOAuthClientsResponse {
  repeated plateau.iam.client.v1.OAuthClient clients = 1;
  string next_page_token = 2;
  optional int64 total_size = 3;
}

message GetOAuthClientRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "iam.plateau.dev/OAuthClient"}
  ];
}

message CreateOAuthClientRequest {
  string oauth_client_id = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.pattern = "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  plateau.iam.client.v1.OAuthClient oauth_client = 2 [(google.api.field_behavior) = REQUIRED];
  string initial_secret_name = 3 [(google.api.field_behavior) = OPTIONAL];
}

message CreateOAuthClientResponse {
  plateau.iam.client.v1.OAuthClient client = 1;
  string client_secret = 2 [(servora.redact.v3.value).string = ""];
}

message UpdateOAuthClientRequest {
  plateau.iam.client.v1.OAuthClient oauth_client = 1 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DisableOAuthClientRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "iam.plateau.dev/OAuthClient"}
  ];
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}

message EnableOAuthClientRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "iam.plateau.dev/OAuthClient"}
  ];
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteOAuthClientRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "iam.plateau.dev/OAuthClient"}
  ];
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}

message CreateOAuthClientSecretRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "iam.plateau.dev/OAuthClient"}
  ];
  string secret_name = 2 [(google.api.field_behavior) = OPTIONAL];
  google.protobuf.Timestamp expires_time = 3 [(google.api.field_behavior) = OPTIONAL];
}

message CreateOAuthClientSecretResponse {
  plateau.iam.client.v1.OAuthClientSecret secret = 1;
  string secret_value = 2 [(servora.redact.v3.value).string = ""];
}

message DeleteOAuthClientSecretRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "iam.plateau.dev/OAuthClient"}
  ];
  string secret_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}
