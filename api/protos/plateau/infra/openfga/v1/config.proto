syntax = "proto3";

package plateau.infra.openfga.v1;

import "buf/validate/validate.proto";
import "servora/conf/v1/annotations.proto";

option go_package = "github.com/Servora-Kit/plateau/api/gen/go/plateau/infra/openfga/v1;openfgaconfpb";

// OpenFGA configures the Plateau OpenFGA SDK client.
message OpenFGA {
  option (servora.conf.v1.section) = true;

  optional string api_url = 1 [
    (servora.conf.v1.field) = {required: true},
    (buf.validate.field).string.min_len = 1
  ];
  optional string store_id = 2 [
    (servora.conf.v1.field) = {required: true},
    (buf.validate.field).string.min_len = 1
  ];
  string model_id = 3;
  string api_token = 4;
}
