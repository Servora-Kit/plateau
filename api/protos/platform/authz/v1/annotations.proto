syntax = "proto3";

package platform.authz.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/Servora-Kit/servora-platform/api/gen/go/platform/authz/v1;authzpb";

// AuthzMode defines the authorization requirement for an RPC method.
enum AuthzMode {
  // Unspecified inherits a service default or produces no generated rule.
  AUTHZ_MODE_UNSPECIFIED = 0;
  // None skips authorization.
  AUTHZ_MODE_NONE = 1;
  // Check evaluates action and resource fields with the configured authorizer.
  AUTHZ_MODE_CHECK = 2;
}

// AuthzRule declares an RPC authorization policy.
message AuthzRule {
  AuthzMode mode = 1;
  string action = 2;
  string resource_type = 3;
  // Required request field path resolving to a singular scalar resource ID.
  string resource_id_field = 4;
}

extend google.protobuf.MethodOptions {
  // rule declares the authorization requirement for an RPC method.
  AuthzRule rule = 50200;
}

extend google.protobuf.ServiceOptions {
  // service_default applies when a method has no non-zero rule.
  AuthzRule service_default = 50201;
}
