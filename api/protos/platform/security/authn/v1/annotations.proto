syntax = "proto3";

package platform.security.authn.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/Servora-Kit/servora-platform/api/gen/go/platform/security/authn/v1;authnpb";

// AuthnMode defines the authentication requirement for an RPC method.
enum AuthnMode {
  AUTHN_MODE_UNSPECIFIED = 0;
  AUTHN_MODE_PUBLIC = 1;
  AUTHN_MODE_REQUIRED = 2;
}

// AuthnRule declares an RPC authentication policy.
message AuthnRule {
  AuthnMode mode = 1;
}

extend google.protobuf.MethodOptions {
  AuthnRule rule = 50300;
}

extend google.protobuf.ServiceOptions {
  AuthnRule service_default = 50301;
}
