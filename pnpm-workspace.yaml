linkWorkspacePackages: true

packages:
  - "api/gen"
  - "app/*/web"
  - "web/packages/*"
  - "!app/admin/web"

# Explicit 1-day cooldown (matches pnpm v12 default) so Renovate syncs it unambiguously
# without relying on a root package.json to infer the pnpm major version.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@servora/plateau-utils"
  - "@servora/proto-utils"

allowBuilds:
  sharp: true
