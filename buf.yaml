version: v2

modules:
  - path: api/protos
  - path: app/audit/service/api/protos
  - path: app/example/service/api/protos

deps:
  - buf.build/servora/servora
  - buf.build/googleapis/googleapis

breaking:
  use:
    - FILE

lint:
  use:
    - STANDARD
  except:
    # - ENUM_VALUE_PREFIX
    # - ENUM_ZERO_VALUE_SUFFIX
    - RPC_REQUEST_RESPONSE_UNIQUE
  ignore_only:
    RPC_RESPONSE_STANDARD_NAME:
      - app/example/service/api/protos/example/service/v1/user.proto
