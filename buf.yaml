version: v2

modules:
  - path: api/protos
    name: buf.build/servora/plateau

deps:
  - buf.build/servora/servora
  - buf.build/googleapis/googleapis
  - buf.build/bufbuild/protovalidate

breaking:
  use:
    - FILE
  ignore_unstable_packages: true

lint:
  use:
    - STANDARD
  except:
    # AIP standard CRUD methods return the resource directly, not XxxResponse.
    - RPC_RESPONSE_STANDARD_NAME
    # AIP standard methods reuse resource/request types by design.
    - RPC_REQUEST_RESPONSE_UNIQUE
