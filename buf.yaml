version: v2

modules:
  - path: api/protos
  - path: app/audit/service/api/protos
  - path: app/example/service/api/protos

  - path: app/iam/service/api/protos

deps:
  - buf.build/servora/servora
  - buf.build/googleapis/googleapis

breaking:
  use:
    - FILE

lint:
  use:
    - STANDARD
  except:
    # AIP standard CRUD methods return the resource directly, not XxxResponse.
    - RPC_RESPONSE_STANDARD_NAME
    # AIP standard methods reuse resource/request types by design.
    - RPC_REQUEST_RESPONSE_UNIQUE
