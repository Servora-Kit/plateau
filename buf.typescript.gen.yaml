version: v2

clean: true

plugins:
  - local: ["go", "tool", "protoc-gen-typescript-http"]
    out: api/gen/ts
  - local: ["go", "tool", "protoc-gen-go-errors"]
    out: api/gen/ts
    opt:
      - target=ts
      - paths=source_relative
  - local: ["go", "tool", "protoc-gen-servora-crud"]
    out: api/gen/ts
    opt:
      - target=ts
      - paths=source_relative
