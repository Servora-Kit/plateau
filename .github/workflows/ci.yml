name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      proto: ${{ github.event_name != 'pull_request' || steps.filter.outputs.proto == 'true' }}
      openfga: ${{ github.event_name != 'pull_request' || steps.filter.outputs.openfga == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
      web_contract: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web_contract == 'true' }}
      admin: ${{ github.event_name != 'pull_request' || steps.filter.outputs.admin == 'true' }}
      ci: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ci == 'true' }}
    steps:
      - name: Detect changed paths
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            go:
              - '**/*.go'
              - 'app/*/service/**'
              - 'cmd/**'
              - 'infra/**'
              - 'internal/**'
              - 'security/**'
              - '!**/*.proto'
            proto:
              - '**/*.proto'
              - 'api/protos/**'
              - 'buf.yaml'
              - 'buf.lock'
              - 'buf.*.gen.yaml'
              - 'app/*/service/api/buf.*.gen.yaml'
            openfga:
              - 'manifests/openfga/**'
              - 'manifests/scripts/openfga/**'
              - 'manifests/scripts/postgres/**'
            web:
              - 'api/gen/ts/**'
              - 'api/gen/package.json'
              - 'api/gen/tsconfig.json'
              - 'web/**'
              - 'app/*/web/**'
              - '!app/admin/web/**'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
            web_contract:
              - 'api/gen/ts/**'
              - 'api/gen/package.json'
              - 'api/gen/tsconfig.json'
              - 'web/packages/**'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
            admin:
              - 'app/admin/web/**'
            ci:
              - '.github/workflows/ci.yml'
              - 'mise.toml'
              - 'justfile'
              - 'just/**'
              - 'prek.toml'
              - 'docker-compose.yaml'
              - 'go.mod'
              - 'go.sum'
              - 'manifests/scripts/ci/**'

  prek:
    name: prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: jdx/mise-action@v5

      - name: Run pre-commit hooks
        run: prek run --all-files --stage pre-commit --skip app/admin/web/ --show-diff-on-failure

  go:
    name: go
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.proto == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: jdx/mise-action@v5

      - name: Cache golangci-lint
        uses: actions/cache@v6
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum', '.golangci.yml', '.golangci.yaml') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-

      - name: Build
        run: go build ./...

      - name: Lint Go
        run: just lint-go

      - name: Test
        run: just test -coverprofile=coverage.out

      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f coverage.out ]; then
            exit 0
          fi
          total="$(go tool cover -func=coverage.out | tail -n 1)"
          {
            echo "### Go Test Coverage"
            echo ""
            echo "\`${total}\`"
            echo ""
            echo "<details><summary>Function coverage details</summary>"
            echo ""
            echo '```text'
            go tool cover -func=coverage.out
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  proto:
    name: proto
    needs: changes
    if: needs.changes.outputs.proto == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v5

      - name: Lint proto
        run: just lint-proto --error-format=github-actions

      - name: Check proto formatting
        run: just fmt-proto-check --error-format=github-actions

      - name: Check breaking changes
        if: github.event_name == 'pull_request'
        env:
          BUF_BREAKING_AGAINST: .git#ref=origin/${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          just breaking --error-format=github-actions

  gen:
    name: gen
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.proto == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: jdx/mise-action@v5

      - name: Check generated code
        run: |
          if ! just gen-check; then
            echo "::error title=Generated code out of date::Run 'GOWORK=off just gen' and commit the updated generated files."
            git status --short
            exit 1
          fi

  integration:
    name: integration
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.proto == 'true' || needs.changes.outputs.openfga == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: jdx/mise-action@v5

      - name: Start compose dependencies
        run: |
          docker compose up -d --wait postgres redis
          docker compose run --rm --no-deps postgres-provision
          docker compose up -d --wait openfga

      - name: Validate and test OpenFGA model
        run: just openfga-model-test

      - name: Prepare integration environment
        run: bash manifests/scripts/ci/setup-integration-env.sh --github-env

      - name: Run integration tests
        run: |
          set -o pipefail
          go test -count=1 -v ./app/... 2>&1 | tee integration-test.log

      - name: Integration test summary
        if: always()
        run: |
          if [ ! -f integration-test.log ]; then
            exit 0
          fi
          passed_count="$(grep -cE '^--- PASS:' integration-test.log || true)"
          failed_count="$(grep -cE '^--- FAIL:' integration-test.log || true)"
          skipped_lines="$(grep -E '^--- SKIP:' integration-test.log || true)"
          skipped_count="$(grep -cE '^--- SKIP:' integration-test.log || true)"
          {
            echo "### Integration Tests"
            echo ""
            echo "- Passed: ${passed_count}"
            echo "- Failed: ${failed_count}"
            echo "- Skipped: ${skipped_count}"
            if [ -n "$skipped_lines" ]; then
              echo ""
              echo "<details><summary>Skipped tests</summary>"
              echo ""
              echo '```text'
              printf '%s\n' "$skipped_lines"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color postgres postgres-provision openfga-migrate openfga redis

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store_path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.store_path }}
          key: pnpm-root-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-root-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check API TypeScript contract
        run: just api-ts-check

      - name: Lint
        run: pnpm -r --if-present run lint

      - name: Typecheck
        run: pnpm -r --if-present run typecheck

      - name: Build
        run: pnpm -r --if-present run build

  admin-web:
    name: admin-web
    needs: changes
    if: needs.changes.outputs.admin == 'true' || needs.changes.outputs.web_contract == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          add_shims_to_path: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store_path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.store_path }}
          key: pnpm-admin-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'app/admin/web/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-admin-${{ runner.os }}-

      - name: Install root workspace dependencies for linked packages
        run: pnpm install --frozen-lockfile

      - name: Install admin web dependencies
        working-directory: app/admin/web
        env:
          npm_config_yes: "true"
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: app/admin/web
        run: pnpm run lint

      - name: Check
        working-directory: app/admin/web
        run: pnpm run check

      - name: Build
        working-directory: app/admin/web
        run: pnpm run build

      - name: Unit tests
        working-directory: app/admin/web
        env:
          TZ: Asia/Shanghai
        run: pnpm run test:unit

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, prek, go, proto, gen, integration, web, admin-web]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PREK_RESULT: ${{ needs.prek.result }}
          GO_RESULT: ${{ needs.go.result }}
          PROTO_RESULT: ${{ needs.proto.result }}
          GEN_RESULT: ${{ needs.gen.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          WEB_RESULT: ${{ needs.web.result }}
          ADMIN_WEB_RESULT: ${{ needs.admin-web.result }}
        run: |
          failed=0
          for entry in \
            "changes:${CHANGES_RESULT}" \
            "prek:${PREK_RESULT}" \
            "go:${GO_RESULT}" \
            "proto:${PROTO_RESULT}" \
            "gen:${GEN_RESULT}" \
            "integration:${INTEGRATION_RESULT}" \
            "web:${WEB_RESULT}" \
            "admin-web:${ADMIN_WEB_RESULT}"; do
            job="${entry%%:*}"
            result="${entry#*:}"
            echo "${job}: ${result}"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::Job '${job}' finished with status '${result}'"
              failed=1
            fi
          done
          exit "$failed"
