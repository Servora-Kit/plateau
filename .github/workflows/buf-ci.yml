name: Buf CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "**.proto"
      - "buf.yaml"
      - "buf.lock"
  delete:
  workflow_dispatch:

concurrency:
  group: buf-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: bufbuild/buf-action@v1
        with:
          token: ${{ secrets.BUF_TOKEN }}
          push_disable_create: true
          # 0.x 阶段关闭自动 breaking 拦截，待 v1.0.0 发布前恢复
          breaking: false
