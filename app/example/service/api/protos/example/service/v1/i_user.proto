syntax = "proto3";

package example.service.v1;

import "example/service/v1/user.proto";
import "google/api/annotations.proto";

option go_package = "github.com/Servora-Kit/servora-platform/api/gen/go/example/service/v1;examplesvcpb";
option java_multiple_files = true;
option java_outer_classname = "InternalUserProto";
option java_package = "dev.servora.example.service.v1";


// UserHTTPService exposes the User CRUD reference flow over HTTP.
service UserHTTPService {
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {get: "/v1/{name=tenants/*/users/*}"};
  }
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {get: "/v1/{parent=tenants/*}/users"};
  }
  rpc CreateUser(CreateUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/{parent=tenants/*}/users"
      body: "user"
    };
  }
  rpc UpdateUser(UpdateUserRequest) returns (User) {
    option (google.api.http) = {
      patch: "/v1/{user.name=tenants/*/users/*}"
      body: "user"
    };
  }
  rpc DeleteUser(DeleteUserRequest) returns (User) {
    option (google.api.http) = {delete: "/v1/{name=tenants/*/users/*}"};
  }
  rpc UndeleteUser(UndeleteUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/{name=tenants/*/users/*}:undelete"
      body: "*"
    };
  }
}
