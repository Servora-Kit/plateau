syntax = "proto3";

package test.service.v1;

option go_package = "github.com/Servora-Kit/plateau/api/gen/go/test/service/v1;testpb";
option java_multiple_files = true;
option java_outer_classname = "TestProto";
option java_package = "dev.servora.test.service.v1";

service TestService {
  rpc Hello(HelloRequest) returns (HelloResponse) {}
}

message HelloRequest {
  string greeting = 1;
}

message HelloResponse {
  string reply = 1;
}
