server:
  http:
    listen:
      addr: "0.0.0.0:8000"
      timeout: 30s
  grpc:
    listen:
      addr: "0.0.0.0:8001"
      timeout: 30s

app:
  name: audit.service
  version: dev
  env: prod
  log:
    level: 0
    filename: "/app/logs/audit.service.log"
    max_size: 20
    max_age: 30
    max_backups: 10

trace:
  endpoint: "otel-collector:4317"
  insecure: true
  sampling_ratio: 1.0

metrics:
  enable: true

registry:
  consul:
    addr: "consul:8500"
    scheme: "http"
    datacenter: "dc1"
    tags:
      - "traefik.enable=true"
      - "traefik.http.routers.audit-api.rule=PathPrefix(`/v1/audit`)"
      - "traefik.http.routers.audit-api.entrypoints=web"
      - "traefik.http.routers.audit-api.service=audit-http"
      - "traefik.http.services.audit-http.loadbalancer.server.port=8000"

discovery:
  consul:
    addr: "consul:8500"
    scheme: "http"
    datacenter: "dc1"
