clickhouse:
  addrs:
    - clickhouse:9000
  database: servora_audit
  username: servora
  password: servora_ch_pwd
  dial_timeout: 10s
  read_timeout: 30s
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 300s

audit_consumer:
  consumer_batch_size: 100
  consumer_flush_interval: 1s
  retention_days: 90
