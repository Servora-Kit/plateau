syntax = "proto3";

package audit.service.conf.v1;

import "google/protobuf/duration.proto";
import "servora/conf/v1/annotations.proto";

option go_package = "github.com/Servora-Kit/servora-platform/api/gen/go/audit/service/conf/v1;auditconfv1";

// =============================================================================
// audit service 私有配置（consumer 侧）
// framework 侧 AuditContract（servora.extra.audit.v1）只承载 emitter 接入契约，
// 这里持有 audit service 消费端 + ClickHouse 存储等业务字段。
// =============================================================================

// AuditConsumerConfig 装载 audit service 自家配置：批量消费与存储保留策略。
// 通过 bootstrap.ScanSections 在 "audit_consumer" section 下加载。
message AuditConsumerConfig {
  option (servora.conf.v1.section) = { key: "audit_consumer", optional: true };

  int32 consumer_batch_size = 1;       // 批量写入大小，默认 100
  google.protobuf.Duration consumer_flush_interval = 2; // 批量刷新间隔，默认 1s
  int32 retention_days = 3;            // ClickHouse 数据保留天数，默认 90
}
