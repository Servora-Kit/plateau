            type: object
            properties:
                name:
                    type: string
                userId:
                    readOnly: true
                    type: string
                    description: Stable, never-reused UUIDv7 identity identifier generated by IAM.
                email:
                    type: string
                    description: Email Login Identifier; service applies trim, Unicode NFC and Unicode case folding for lookup.
                profile:
                    allOf:
                        - $ref: '#/components/schemas/UserProfile'
                    description: OIDC standard profile fields only; no Tenant, Membership, role or metadata.
                status:
                    readOnly: true
                    enum:
                        - USER_STATUS_UNSPECIFIED
                        - USER_STATUS_PENDING_EMAIL_VERIFICATION
                        - USER_STATUS_ACTIVE
                        - USER_STATUS_DISABLED
                    type: string
                    format: enum
                emailVerified:
                    readOnly: true
                    type: boolean
                    description: True only after the one-time email verification flow succeeds.
                emailVerifiedTime:
                    readOnly: true
                    type: string
                    format: date-time
                createTime:
                    readOnly: true
                    type: string
                    format: date-time
                updateTime:
                    readOnly: true
                    type: string
                    format: date-time
                etag:
                    readOnly: true
                    type: string
                deleteTime:
                    readOnly: true
                    type: string
                    format: date-time
                purgeTime:
                    readOnly: true
                    type: string
                    format: date-time
                requiredActions:
                    readOnly: true
                    type: array
                    items:
                        enum:
                            - USER_REQUIRED_ACTION_UNSPECIFIED
                            - USER_REQUIRED_ACTION_UPDATE_PASSWORD
                        type: string
                        format: enum
            description: User is the globally unique IAM identity resource.
        UserProfile:
            type: object
            properties:
                name:
                    type: string
                givenName:
                    type: string
                familyName:
                    type: string
                nickname:
                    type: string
                preferredUsername:
                    type: string
                picture:
                    type: string
                locale:
                    type: string
            description: UserProfile contains the OIDC standard profile fields supported by IAM.
        VerifyEmailRequest:
            required:
                - token
            type: object
            properties:
                token:
                    type: string
                    description: One-time email verification token; never accepted from a query parameter.
        VerifyEmailResponse:
            type: object
            properties:
                user:
                    $ref: '#/components/schemas/User'
tags:
    - name: AccountService
      description: AccountService owns self-service registration, profile and recovery flows.
    - name: AuthnService
      description: AuthnService owns server-side browser authentication flows.
    - name: SessionService
      description: SessionService owns IAM Login Session lifecycle commands.
