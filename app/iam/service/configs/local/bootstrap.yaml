server:
  http:
    api_docs:
      enable: true
      path: "./internal/assets/openapi.yaml"
    listen:
      addr: "0.0.0.0:10000"
      timeout: 30s
  grpc:
    listen:
      addr: "0.0.0.0:10001"
      timeout: 30s

data:
  database:
    driver: postgresql
    source: "${IAM_DATABASE_SOURCE:postgres://iam:iam@localhost:5432/iam?sslmode=disable}"

app:
  name: iam.service
  version: dev
  env: dev
  external_url: "${IAM_PUBLIC_ORIGIN:http://iam.plateau.localhost:8080}"

obs:
  log:
    level: 1
    backends:
      - stdout: {}
      - file:
          path: "./logs/iam.service.log"
          max_size: 20
          max_age: 30
          max_backups: 10
  trace:
    endpoint: "localhost:4317"
    insecure: true
    sampling_ratio: 1.0
  metrics:
    enable: true

registry:
  consul:
    addr: "${REGISTRY_CONSUL_ADDR:localhost:8500}"
    scheme: "${REGISTRY_CONSUL_SCHEME:http}"
    datacenter: "${REGISTRY_CONSUL_DC:dc1}"
    tags:
      - "traefik.enable=true"
      - "traefik.http.routers.iam-api.entrypoints=web"
      - "traefik.http.routers.iam-api.priority=100"
      - "traefik.http.routers.iam-api.rule=Host(`iam.plateau.localhost`) && (PathPrefix(`/v1/`) || PathPrefix(`/cap/`) || PathPrefix(`/.well-known/`) || Path(`/keys`) || Path(`/authorize`) || PathPrefix(`/authorize/`) || PathPrefix(`/oauth/`) || Path(`/userinfo`) || Path(`/revoke`) || Path(`/end_session`) || Path(`/docs`) || PathPrefix(`/docs/`))"
      - "traefik.http.routers.iam-api.service=iam-api"
      - "traefik.http.services.iam-api.loadbalancer.passhostheader=true"
      - "traefik.http.services.iam-api.loadbalancer.server.port=10000"
