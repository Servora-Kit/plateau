syntax = "proto3";

package iam.user.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "plateau/security/authn/v1/annotations.proto";
import "plateau/security/authz/v1/annotations.proto";
import "servora/errors/v1/errors.proto";

option go_package = "github.com/Servora-Kit/plateau/api/gen/go/iam/user/v1;userpb";

// UserService exposes administrator-facing global user management.
service UserService {
  option (plateau.security.authn.v1.service_default) = {mode: AUTHN_MODE_REQUIRED};
  option (plateau.security.authz.v1.service_default) = {
    mode: AUTHZ_MODE_REQUIRED
    action: "can_manage_users"
    resource_type: "plateau"
    resource_id: "default"
  };

  // CreateUser creates a pending user without accepting an initial password.
  rpc CreateUser(CreateUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/iam/users"
      body: "user"
    };
    option (google.api.method_signature) = "user,user_id";
  }

  // GetUser returns one global IAM user by resource name.
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {get: "/v1/iam/users/{name=users/*}"};
    option (google.api.method_signature) = "name";
  }

  // ListUsers returns a page of globally unique IAM users.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {get: "/v1/iam/users"};
    option (google.api.method_signature) = "page_size,page_token,filter,order_by";
  }

  // UpdateUser updates administrator-editable profile fields.
  rpc UpdateUser(UpdateUserRequest) returns (User) {
    option (google.api.http) = {
      patch: "/v1/iam/users/{user.name=users/*}"
      body: "user"
    };
    option (google.api.method_signature) = "user,update_mask";
  }

  // DisableUser disables credentials and revokes every active session.
  rpc DisableUser(DisableUserRequest) returns (DisableUserResponse) {
    option (google.api.http) = {
      post: "/v1/iam/users/{name=users/*}:disable"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // EnableUser enables a disabled user without restoring revoked sessions.
  rpc EnableUser(EnableUserRequest) returns (EnableUserResponse) {
    option (google.api.http) = {
      post: "/v1/iam/users/{name=users/*}:enable"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
}

// UserErrorReason contains administrator-visible user-management failures.
enum UserErrorReason {
  option (servora.errors.v1.default_code) = 500;

  USER_ERROR_REASON_UNSPECIFIED = 0;
  USER_ERROR_REASON_NOT_FOUND = 1 [(servora.errors.v1.code) = 404];
  USER_ERROR_REASON_ALREADY_EXISTS = 2 [(servora.errors.v1.code) = 409];
  USER_ERROR_REASON_INVALID_STATE = 3 [(servora.errors.v1.code) = 409];
  USER_ERROR_REASON_ETAG_MISMATCH = 4 [(servora.errors.v1.code) = 409];
}

// UserStatus describes the account lifecycle state.
enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_PENDING_EMAIL_VERIFICATION = 1;
  USER_STATUS_ACTIVE = 2;
  USER_STATUS_DISABLED = 3;
}

// UserProfile contains the OIDC standard profile fields supported by IAM.
message UserProfile {
  optional string name = 1 [(google.api.field_behavior) = OPTIONAL];
  optional string given_name = 2 [(google.api.field_behavior) = OPTIONAL];
  optional string family_name = 3 [(google.api.field_behavior) = OPTIONAL];
  optional string nickname = 4 [(google.api.field_behavior) = OPTIONAL];
  optional string preferred_username = 5 [(google.api.field_behavior) = OPTIONAL];
  optional string picture = 6 [(google.api.field_behavior) = OPTIONAL];
  optional string locale = 7 [(google.api.field_behavior) = OPTIONAL];
}

// User is the globally unique IAM identity resource.
message User {
  option (google.api.resource) = {
    type: "iam.plateau.dev/User"
    pattern: "users/{user}"
    singular: "user"
    plural: "users"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string user_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  optional string email = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];
  UserProfile profile = 4 [(google.api.field_behavior) = OPTIONAL];
  UserStatus status = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  bool email_verified = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp email_verified_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  string etag = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message CreateUserRequest {
  // user_id is an optional stable identifier; IAM generates one when omitted.
  string user_id = 1 [(google.api.field_behavior) = OPTIONAL];
  User user = 2 [(google.api.field_behavior) = REQUIRED];
}

message GetUserRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "iam.plateau.dev/User"}
  ];
}

message ListUsersRequest {
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];
  string order_by = 4 [(google.api.field_behavior) = OPTIONAL];
}

message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
}

message UpdateUserRequest {
  // Only profile fields are mutable through this administrator API.
  User user = 1 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DisableUserRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "iam.plateau.dev/User"}
  ];
  string reason = 2 [(google.api.field_behavior) = OPTIONAL];
  string etag = 3 [(google.api.field_behavior) = OPTIONAL];
}

message EnableUserRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "iam.plateau.dev/User"}
  ];
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DisableUserResponse {
  User user = 1;
}

message EnableUserResponse {
  User user = 1;
}
