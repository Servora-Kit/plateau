syntax = "proto3";

package iam.authn.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "iam/session/v1/session.proto";
import "iam/user/v1/user.proto";
import "plateau/security/authn/v1/annotations.proto";
import "plateau/security/authz/v1/annotations.proto";
import "buf/validate/validate.proto";
import "servora/redact/v3/redact.proto";
import "servora/errors/v1/errors.proto";

option go_package = "github.com/Servora-Kit/plateau/api/gen/go/iam/authn/v1;authnpb";

// AuthnService owns email/password authentication.
service AuthnService {
  option (plateau.security.authz.v1.service_default) = {mode: AUTHZ_MODE_NONE};
  // Login verifies credentials and establishes one opaque browser session.
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/iam/authn/login"
      body: "*"
    };
    option (google.api.method_signature) = "email,password";
    option (plateau.security.authn.v1.rule) = {mode: AUTHN_MODE_PUBLIC};
  }
}

// AuthnErrorReason contains intentionally generic credential failures.
enum AuthnErrorReason {
  option (servora.errors.v1.default_code) = 500;

  AUTHN_ERROR_REASON_UNSPECIFIED = 0;
  AUTHN_ERROR_REASON_INVALID_CREDENTIALS = 1 [(servora.errors.v1.code) = 401];
}


message LoginRequest {
  // Service canonicalizes email before locating the Login Identifier.
  string email = 1 [(google.api.field_behavior) = REQUIRED];
  string password = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 8, max_len: 128},
    (servora.redact.v3.value).string = ""
  ];
}

message LoginResponse {
  iam.user.v1.User user = 1;
  iam.session.v1.Session session = 2;
}

