version: v2

clean: false

managed:
    enabled: true

    disable:
        - module: buf.build/googleapis/googleapis
        - module: buf.build/bufbuild/protovalidate
        - module: buf.build/servora/servora

inputs:
    - directory: .
      paths:
          - api/protos/iam/user/v1
          - api/protos/iam/account/v1
          - api/protos/iam/authn/v1
          - api/protos/iam/session/v1

plugins:
    - local: ["go", "tool", "protoc-gen-openapi"]
      strategy: all
      out: app/iam/service/internal/assets
      opt:
          - naming=json
          - depth=2
          - default_response=false
          - enum_type=string
          - output_mode=merged
          - fq_schema_naming=false
