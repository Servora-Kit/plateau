default_stages = ["pre-commit"]

exclude = { glob = [
  "pnpm-lock.yaml",
  "**/node_modules/**",
  "**/dist/**",
] }

[[repos]]
repo = "local"

[[repos.hooks]]
id = "oxlint"
name = "oxlint"
entry = "pnpm exec oxlint --fix --type-aware --threads=4 --no-error-on-unmatched-pattern"
language = "system"
files = '\.(js|jsx|ts|tsx|vue|cjs|mjs|cts|mts)$'
stages = ["pre-commit"]

[[repos.hooks]]
id = "oxfmt"
name = "oxfmt"
entry = "pnpm exec oxfmt --threads=4 --no-error-on-unmatched-pattern"
language = "system"
files = '\.(js|jsx|ts|tsx|vue|cjs|mjs|cts|mts|json|jsonc)$'
stages = ["pre-commit"]

[[repos.hooks]]
id = "eslint"
name = "eslint"
entry = "pnpm exec eslint --fix"
language = "system"
files = '\.(js|jsx|ts|tsx|vue|cjs|mjs|cts|mts)$'
stages = ["pre-commit"]

[[repos.hooks]]
id = "stylelint"
name = "stylelint"
entry = "pnpm exec stylelint --fix"
language = "system"
files = '\.(vue|css|less|scss)$'
stages = ["pre-commit"]

[[repos.hooks]]
id = "check-type"
name = "check:type"
entry = "pnpm check:type"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-push"]
