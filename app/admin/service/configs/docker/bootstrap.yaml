server:
  http:
    api_docs:
      enable: true
      path: "./internal/assets/openapi.yaml"
    listen:
      addr: "0.0.0.0:10010"
      timeout: 30s

data:
  database:
    driver: postgresql
    source: "${ADMIN_DATABASE_SOURCE:postgres://postgres:postgres@postgres:5432/admin?sslmode=disable}"
  client:
    services:
      - name: iam.service
        endpoints:
          - protocol: grpc
            endpoint: "${IAM_GRPC_ENDPOINT:discovery:///iam.service}"
            timeout: 5s
      - name: audit.service
        endpoints:
          - protocol: grpc
            endpoint: "${AUDIT_GRPC_ENDPOINT:discovery:///audit.service}"
            timeout: 5s

app:
  name: admin.service
  version: dev
  env: dev
  external_url: "${ADMIN_PUBLIC_ORIGIN:https://admin.plateau.local}"

obs:
  log:
    level: 1
    backends:
      - stdout: {}
      - file:
          path: "./logs/admin.service.log"
          max_size: 20
          max_age: 30
          max_backups: 10
  trace:
    endpoint: "otel-collector:4317"
    insecure: true
    sampling_ratio: 1.0
  metrics:
    enable: true

registry:
  consul:
    addr: "${REGISTRY_CONSUL_ADDR:consul:8500}"
    scheme: "${REGISTRY_CONSUL_SCHEME:http}"
    datacenter: "${REGISTRY_CONSUL_DC:dc1}"
    tags:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-api.entrypoints=web"
      - "traefik.http.routers.admin-api.priority=100"
      - "traefik.http.routers.admin-api.rule=Host(`admin.plateau.local`) && (PathPrefix(`/v1/`) || Path(`/docs`) || PathPrefix(`/docs/`))"
      - "traefik.http.routers.admin-api.service=admin-api"
      - "traefik.http.services.admin-api.loadbalancer.passhostheader=true"
      - "traefik.http.services.admin-api.loadbalancer.server.port=10010"
