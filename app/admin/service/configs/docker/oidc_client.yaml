oidc_client:
  issuer: "${IAM_PUBLIC_ORIGIN:https://iam.plateau.local}"
  client_id: admin
  client_secret: "${IAM_ADMIN_CLIENT_SECRET}"
  redirect_uri: "${ADMIN_OIDC_REDIRECT_URI:https://admin.plateau.local/v1/admin/auth/callback}"
  cookie_secret: "${ADMIN_OIDC_COOKIE_SECRET}"
  scopes:
    - openid
    - profile
    - email
  http_timeout: 5s
