version: v2

clean: false

managed:
    enabled: true
    disable:
        - module: buf.build/googleapis/googleapis
        - module: buf.build/bufbuild/protovalidate
        - module: buf.build/servora/servora

inputs:
    - directory: .
      paths:
          - app/admin/service/api/protos/admin/auth/v1
          - app/admin/service/api/protos/admin/user/v1

plugins:
    - local: protoc-gen-openapi
      strategy: all
      out: app/admin/service/internal/assets
      opt:
          - naming=json
          - depth=2
          - default_response=false
          - enum_type=string
          - output_mode=merged
          - fq_schema_naming=false
